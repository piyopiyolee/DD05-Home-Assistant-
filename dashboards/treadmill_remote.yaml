# Dashboard export (lovelace.treadmill_remote). Create a new dashboard, open the Raw configuration editor and paste this.
title: 走步機
views:
- title: 遙控器
  path: remote
  icon: mdi:remote
  type: panel
  cards:
  - type: vertical-stack
    cards:
    - type: glance
      title: 走步機
      columns: 4
      show_name: true
      show_state: true
      entities:
      - entity: sensor.treadmill_speed
        name: 速度
      - entity: sensor.treadmill_inclination
        name: 坡度
      - entity: sensor.treadmill_time_elapsed
        name: 時間
      - entity: sensor.treadmill_distance_total
        name: 距離
    - type: button
      entity: script.treadmill_toggle
      name: 開始 / 暫停
      icon: mdi:play-pause
      show_state: false
      icon_height: 56px
      tap_action:
        action: perform-action
        perform_action: script.treadmill_toggle
      hold_action:
        action: none
    - type: grid
      columns: 2
      square: false
      cards:
      - type: button
        entity: script.treadmill_speed_up
        name: 速度 +
        icon: mdi:chevron-double-up
        show_state: false
        icon_height: 56px
        tap_action:
          action: perform-action
          perform_action: script.treadmill_speed_up
        hold_action:
          action: none
      - type: button
        entity: script.treadmill_incline_up
        name: 坡度 +
        icon: mdi:slope-uphill
        show_state: false
        icon_height: 56px
        tap_action:
          action: perform-action
          perform_action: script.treadmill_incline_up
        hold_action:
          action: none
      - type: button
        entity: script.treadmill_speed_down
        name: 速度 −
        icon: mdi:chevron-double-down
        show_state: false
        icon_height: 56px
        tap_action:
          action: perform-action
          perform_action: script.treadmill_speed_down
        hold_action:
          action: none
      - type: button
        entity: script.treadmill_incline_down
        name: 坡度 −
        icon: mdi:slope-downhill
        show_state: false
        icon_height: 56px
        tap_action:
          action: perform-action
          perform_action: script.treadmill_incline_down
        hold_action:
          action: none
    - type: button
      entity: script.treadmill_stop
      name: 停止
      icon: mdi:stop-circle
      show_state: false
      icon_height: 56px
      tap_action:
        action: perform-action
        perform_action: script.treadmill_stop
      hold_action:
        action: none
