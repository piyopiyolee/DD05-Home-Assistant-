            \ > div > hui-picture-entity-card { display: block; height: 100%; min-height:\
            \ 0; }"
          custom_fields:
            head: "[[[ const na = ['unavailable', 'unknown', '']; const g = (e) => (states[e]\
              \ ? String(states[e].state).trim() : ''); const state = g('input_select.training_state');\
              \ const label = g('sensor.training_state_display').replace(/（[^）]*）/g, '');\
              \ const phase = g('input_text.training_phase'); const round = g('sensor.training_round_display');\
              \ const tone = state === 'running' ? ['var(--mlh-body)', 'var(--mlh-body-tint)']\
              \ : state === 'paused' ? ['var(--mlh-caution)', 'color-mix(in srgb, var(--mlh-caution)\
              \ 16%, transparent)'] : ['starting', 'resuming', 'finishing'].includes(state)\
              \ ? ['var(--mlh-primary)', 'var(--mlh-brand-tint)'] : ['var(--mlh-muted)', 'var(--mlh-surface2)'];\
              \ const v = (x) => (na.includes(x) ? '—' : x); const k = (t) => '<span style=\"\
              flex:none;color:var(--mlh-muted);font-weight:500;margin-right:8px\">' + t +\
              \ '</span>'; const b = (t) => '<span style=\"min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--mlh-fg);font-weight:700\"\
              >' + t + '</span>'; const chip = '<span style=\"flex:none;display:inline-flex;align-items:center;gap:6px;padding:3px\
              \ 10px;border-radius:999px;font-weight:700;color:' + tone[0] + ';background:'\
              \ + tone[1] + '\">' + '<span style=\"width:7px;height:7px;border-radius:50%;background:'\
              \ + tone[0] + '\"></span>' + v(label) + '</span>'; const line = 'display:flex;align-items:center;min-width:0;white-space:nowrap;font-size:14px;line-height:22px';\
              \ return '<div style=\"' + line + ';justify-content:space-between;gap:12px\"\
              >' + chip + '<span style=\"display:flex;min-width:0\">' + k('輪數') + b(v(round))\
              \ + '</span></div>' + '<div style=\"' + line + ';margin-top:6px;font-size:15px\"\
              >' + k('階段') + b(v(phase)) + '</div>'; ]]]"
            seg: "[[[ const s = states['sensor.training_segment_remaining_mmss']; const v\
              \ = s ? String(s.state).trim() : ''; const ok = !['unavailable', 'unknown',\
              \ ''].includes(v); return '<div style=\"display:flex;flex-direction:column;align-items:flex-start;justify-content:center;height:100%;white-space:nowrap;text-align:left\"\
              >' + '<span style=\"font-size:13px;font-weight:500;line-height:1;color:var(--mlh-muted)\"\
