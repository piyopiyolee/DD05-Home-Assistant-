      time:
        card:
          type: custom:button-card
          entity: sensor.treadmill_time_elapsed
          name: 時間
          show_icon: false
          show_name: true
          show_state: false
          show_label: false
          triggers_update:
          - sensor.treadmill_time_elapsed
          tap_action:
            action: none
          hold_action:
            action: none
          double_tap_action:
            action: none
          extra_styles: "ha-ripple, mwc-ripple { display: none !important; }"
          custom_fields:
            v: "[[[ const s = states['sensor.treadmill_time_elapsed']; const n = s ? Number(s.state)\
              \ : NaN; if (!s || String(s.state).trim() === '' || !Number.isFinite(n) || n\
              \ < 0) return '—'; const t = Math.round(n), h = Math.floor(t / 3600), m = Math.floor((t\
              \ % 3600) / 60), sec = t % 60; const p = (x) => String(x).padStart(2, '0');\
              \ return h > 0 ? h + ':' + p(m) + ':' + p(sec) : p(m) + ':' + p(sec); ]]]"
          styles:
