# Dashboard export (lovelace.treadmill-remote, 2026-11-22).
# 新增儀表板時，URL 路徑請設成 `treadmill-remote`（設定子頁會導向 /treadmill-remote/custom，返回主頁為 /treadmill-remote/remote）。
# 需要 HACS 自訂卡片 button-card（實測 7.0.1）。貼到「原始設定編輯器」。
# 主頁 path: remote；設定子頁 path: custom（暖身／快走／緩和／收操／輪數，+/- 按鈕；儲存只是返回主頁，數值在按 +/- 時已寫入輔助元件）。
title: 走步機
views:
- title: 走步機
  path: remote
  icon: mdi:walk
  type: panel
  cards:
  - type: custom:button-card
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    triggers_update:
    - sun.sun
    extra_styles: ":host { display: block; width: 100%; } ha-ripple, mwc-ripple { display:\
      \ none !important; } #container > div { min-width: 0; min-height: 0; } #container >\
      \ div > button-card, #container > div > hui-picture-entity-card { display: block; height:\
      \ 100%; min-height: 0; } @supports not (height: 100dvh) { ha-card { height: calc(100vh\
      \ - var(--header-height, 56px) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom,\
      \ 0px)) !important; } }"
    custom_fields:
      spd:
        card:
          type: custom:button-card
          show_icon: false
          show_name: false
          show_state: false
          show_label: false
          tap_action:
            action: none
          hold_action:
            action: none
          double_tap_action:
            action: none
          triggers_update:
          - sensor.treadmill_speed
          extra_styles: "ha-ripple, mwc-ripple { display: none !important; } #container >\
            \ div { min-width: 0; min-height: 0; } #container > div > button-card, #container\
            \ > div > hui-picture-entity-card { display: block; height: 100%; min-height:\
            \ 0; }"
          custom_fields:
            up:
              card:
                type: custom:button-card
                name: 加速
                icon: mdi:plus-thick
                show_icon: false
                show_name: false
                show_state: false
                show_label: false
                tap_action:
                  action: perform-action
                  perform_action: script.treadmill_speed_up
                  haptic: light
                hold_action:
                  action: none
                double_tap_action:
                  action: none
                extra_styles: "ha-card { transition: transform 120ms ease, filter 120ms ease,\
                  \ background-color 160ms ease; -webkit-tap-highlight-color: transparent;\
                  \ } ha-card:active { transform: scale(0.98); filter: brightness(1.08); }"
                custom_fields:
                  lbl: "[[[ return \"<ha-icon icon=\\\"mdi:plus-thick\\\" style=\\\"--mdc-icon-size:24px;width:24px;height:24px;margin:0;flex:none;\\\
                    \"></ha-icon><span>加速</span>\"; ]]]"
                styles:
                  card:
                  - height: 100%
                  - box-sizing: border-box
                  - padding: '0'
                  - margin: '0'
                  - background: var(--mlh-training-tint)
                  - color: var(--mlh-training)
                  - border: none
                  - border-radius: 12px
                  - box-shadow: none
                  grid:
                  - grid-template-areas: "\"lbl\""
                  - grid-template-columns: minmax(0, 1fr)
                  - grid-template-rows: 1fr
                  - height: 100%
                  custom_fields:
                    lbl:
                    - display: flex
                    - align-items: center
                    - justify-content: center
                    - gap: 6px
                    - font-size: 17px
                    - font-weight: '700'
                    - white-space: nowrap
              do_not_eval: true
            val: "[[[ const sensor = \"sensor.treadmill_speed\"; const caption = \"速度\"; const\
              \ unit = \"km/h\"; const digits = 1; const accent = \"var(--mlh-training)\"\
              ; const fg = \"var(--mlh-fg)\"; const muted = \"var(--mlh-muted)\"; const s\
              \ = states[sensor]; const v = s ? String(s.state).trim() : ''; const n = Number(v);\
              \ const ok = !(v === '' || v === 'unknown' || v === 'unavailable' || !Number.isFinite(n));\
              \ return '<div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;line-height:1\"\
              >' + '<span style=\"font-size:13px;font-weight:700;letter-spacing:0.04em;color:'\
              \ + accent + '\">' + caption + '</span>' + '<span style=\"margin-top:6px;font-size:clamp(38px,\
              \ 6vh, 56px);font-weight:700;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;color:'\
              \ + (ok ? fg : muted) + '\">' + (ok ? n.toFixed(digits) : '—') + '</span>' +\
              \ '<span style=\"margin-top:4px;font-size:13px;font-weight:500;color:' + muted\
              \ + '\">' + unit + '</span></div>'; ]]]"
            down:
              card:
                type: custom:button-card
                name: 減速
                icon: mdi:minus-thick
                show_icon: false
                show_name: false
                show_state: false
                show_label: false
                tap_action:
                  action: perform-action
                  perform_action: script.treadmill_speed_down
                  haptic: light
                hold_action:
                  action: none
                double_tap_action:
                  action: none
                extra_styles: "ha-card { transition: transform 120ms ease, filter 120ms ease,\
                  \ background-color 160ms ease; -webkit-tap-highlight-color: transparent;\
                  \ } ha-card:active { transform: scale(0.98); filter: brightness(1.08); }"
                custom_fields:
                  lbl: "[[[ return \"<ha-icon icon=\\\"mdi:minus-thick\\\" style=\\\"--mdc-icon-size:24px;width:24px;height:24px;margin:0;flex:none;\\\
                    \"></ha-icon><span>減速</span>\"; ]]]"
                styles:
                  card:
                  - height: 100%
                  - box-sizing: border-box
                  - padding: '0'
                  - margin: '0'
                  - background: var(--mlh-training-tint)
                  - color: var(--mlh-training)
                  - border: none
                  - border-radius: 12px
                  - box-shadow: none
                  grid:
                  - grid-template-areas: "\"lbl\""
                  - grid-template-columns: minmax(0, 1fr)
                  - grid-template-rows: 1fr
                  - height: 100%
                  custom_fields:
                    lbl:
                    - display: flex
                    - align-items: center
                    - justify-content: center
                    - gap: 6px
                    - font-size: 17px
                    - font-weight: '700'
                    - white-space: nowrap
              do_not_eval: true
          styles:
            card:
            - height: 100%
            - box-sizing: border-box
            - padding: 8px
            - margin: '0'
            - overflow: hidden
            - cursor: default
            - background: var(--mlh-card)
            - border: 1px solid var(--mlh-border)
