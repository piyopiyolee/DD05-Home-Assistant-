              \ + (ok ? 'var(--mlh-fg)' : 'var(--mlh-muted)') + '\">' + (ok ? v : '--:--')\
              \ + '</span></div>'; ]]]"
            tot_l: "[[[ return \"<span style=\\\"font-size:13px;font-weight:500;color:var(--mlh-muted)\\\
              \">總剩餘</span>\"; ]]]"
            tot: "[[[ const id = \"sensor.training_remaining_mmss\"; const size = \"24px\"\
              ; const weight = \"700\"; const fg = \"var(--mlh-fg)\"; const muted = \"var(--mlh-muted)\"\
              ; const s = states[id]; const v = s ? String(s.state).trim() : ''; const ok\
              \ = !['unavailable', 'unknown', ''].includes(v); return '<span style=\"white-space:nowrap;font-size:'\
              \ + size + ';font-weight:' + weight + ';line-height:1;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;color:'\
              \ + (ok ? fg : muted) + '\">' + (ok ? v : '--:--') + '</span>'; ]]]"
            ela_l: "[[[ return \"<span style=\\\"font-size:13px;font-weight:500;color:var(--mlh-muted)\\\
              \">已進行</span>\"; ]]]"
            ela: "[[[ const id = \"sensor.training_elapsed_mmss\"; const size = \"24px\";\
              \ const weight = \"700\"; const fg = \"var(--mlh-fg)\"; const muted = \"var(--mlh-muted)\"\
              ; const s = states[id]; const v = s ? String(s.state).trim() : ''; const ok\
              \ = !['unavailable', 'unknown', ''].includes(v); return '<span style=\"white-space:nowrap;font-size:'\
              \ + size + ';font-weight:' + weight + ';line-height:1;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;color:'\
