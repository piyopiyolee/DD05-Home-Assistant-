# Dashboard export (lovelace.training). Create a new dashboard, open the Raw configuration editor and paste this.
# Updated 2026-11-17: replaced 35-min & 3-min programs with 間歇 10 分 (SVG /local/training/interval10_v2.svg) and 自訂課表 (/training/custom).
title: Training
views:
- title: 訓練課表
  path: home
  icon: mdi:run
  cards:
  - type: vertical-stack
    cards:
    - type: markdown
      title: 🏃 走步機訓練課表
      content: 請點選下方課表進入詳細頁。課表只會在您按下「**開始**」後並確認跑帶開始轉動才啟動計時；若途中手動按停走步機或拔除安全鎖，課表會在數秒內自動安全中止。
    - type: glance
      title: 目前訓練與走步機狀態
      columns: 4
      show_name: true
      show_state: true
      entities:
      - entity: sensor.training_state_display
        name: 狀態
      - entity: input_text.training_phase
        name: 目前階段
      - entity: sensor.training_remaining_mmss
        name: 總剩餘
      - entity: sensor.treadmill_speed
        name: 目前速度
    - type: button
      name: 間歇 10 分（5 輪 × 4.5 km/h 坡度 4%）
      icon: mdi:run
      show_state: false
      icon_height: 64px
      tap_action:
        action: navigate
        navigation_path: /training/interval-10
      hold_action:
        action: none
    - type: button
      name: 自訂課表（自由調整時間／速度／坡度／輪數）
      icon: mdi:tune
      show_state: false
      icon_height: 64px
      tap_action:
        action: navigate
        navigation_path: /training/custom
      hold_action:
        action: none
- title: 間歇 10 分
  path: interval-10
  icon: mdi:run
  subview: true
  cards:
  - type: vertical-stack
    cards:
    - type: glance
      title: 即時訓練狀態
      columns: 4
      show_name: true
      show_state: true
      entities:
      - entity: sensor.training_state_display
        name: 執行狀態
      - entity: input_text.training_phase
        name: 目前階段
      - entity: sensor.training_round_display
        name: 目前輪數
      - entity: sensor.training_remaining_mmss
        name: 總剩餘時間
      - entity: sensor.training_segment_remaining_mmss
        name: 本段剩餘
      - entity: sensor.treadmill_speed
        name: 目前速度
      - entity: sensor.treadmill_inclination
        name: 目前坡度
      - entity: sensor.training_elapsed_mmss
        name: 已進行時間
    - type: grid
      columns: 3
      square: false
      cards:
      - type: button
        entity: script.training_interval_10
        name: 開始 / 繼續
        icon: mdi:play
        show_state: false
        icon_height: 56px
        tap_action:
          action: perform-action
          perform_action: script.training_interval_10
        hold_action:
          action: none
      - type: button
        entity: script.training_pause
        name: 暫停 / 繼續
        icon: mdi:play-pause
        show_state: false
        icon_height: 56px
        tap_action:
          action: perform-action
          perform_action: script.training_pause
        hold_action:
          action: none
      - type: button
        entity: script.training_end
        name: 結束課表
        icon: mdi:stop-circle
        show_state: false
        icon_height: 56px
        tap_action:
          action: perform-action
          perform_action: script.training_end
        hold_action:
          action: none
    - type: picture
      image: /local/training/interval10_v2.svg?v=2
      tap_action:
        action: none
      hold_action:
        action: none
    - type: markdown
      content: 暖身 45 秒（3.0 km/h）→ 5 輪：快走 1 分（4.5 km/h、坡度 4%）、緩和 45 秒（3.0 km/h）→ 收操
        30 秒（2.0 km/h）
- title: 自訂課表
  path: custom
  icon: mdi:tune
  subview: true
  cards:
  - type: vertical-stack
    cards:
    - type: glance
      title: 即時訓練狀態
      columns: 4
      show_name: true
      show_state: true
      entities:
      - entity: sensor.training_state_display
        name: 執行狀態
      - entity: input_text.training_phase
        name: 目前階段
      - entity: sensor.training_round_display
        name: 目前輪數
      - entity: sensor.training_remaining_mmss
        name: 總剩餘時間
      - entity: sensor.training_segment_remaining_mmss
        name: 本段剩餘
      - entity: sensor.treadmill_speed
        name: 目前速度
      - entity: sensor.treadmill_inclination
        name: 目前坡度
      - entity: sensor.training_elapsed_mmss
        name: 已進行時間
    - type: grid
      columns: 3
      square: false
      cards:
      - type: button
        entity: script.training_custom
        name: 開始 / 繼續
        icon: mdi:play
        show_state: false
        icon_height: 56px
        tap_action:
          action: perform-action
          perform_action: script.training_custom
        hold_action:
          action: none
      - type: button
        entity: script.training_pause
        name: 暫停 / 繼續
        icon: mdi:play-pause
        show_state: false
        icon_height: 56px
        tap_action:
          action: perform-action
          perform_action: script.training_pause
        hold_action:
          action: none
      - type: button
        entity: script.training_end
        name: 結束課表
        icon: mdi:stop-circle
        show_state: false
        icon_height: 56px
        tap_action:
          action: perform-action
          perform_action: script.training_end
        hold_action:
          action: none
    - type: markdown
      content: 滑動調整下方各段參數與輪數後按「開始 / 繼續」，執行中修改設定不會影響正在進行的訓練。
    - type: entities
      title: ⚙️ 課表總覽與輪數
      entities:
      - entity: sensor.training_custom_total_mmss
        name: 預估總時長
      - entity: input_number.training_custom_rounds
        name: 間歇輪數 (5–30)
    - type: entities
      title: 🔥 暖身
      entities:
      - entity: input_number.training_custom_warmup_dur
        name: 暖身時間 (30–120s)
      - entity: input_number.training_custom_warmup_speed
        name: 暖身速度 (2.0–6.0 km/h)
      - entity: input_number.training_custom_warmup_incline
        name: 暖身坡度 (0–15%)
    - type: entities
      title: 🏃 快走（每輪高強度）
      entities:
      - entity: input_number.training_custom_fast_dur
        name: 快走時間 (30–120s)
      - entity: input_number.training_custom_fast_speed
        name: 快走速度 (2.0–6.0 km/h)
      - entity: input_number.training_custom_fast_incline
        name: 快走坡度 (0–15%)
    - type: entities
      title: 😮‍💨 緩和（每輪恢復）
      entities:
      - entity: input_number.training_custom_rest_dur
        name: 緩和時間 (30–120s)
      - entity: input_number.training_custom_rest_speed
        name: 緩和速度 (2.0–6.0 km/h)
      - entity: input_number.training_custom_rest_incline
        name: 緩和坡度 (0–15%)
    - type: entities
      title: ❄️ 收操
      entities:
      - entity: input_number.training_custom_cooldown_dur
        name: 收操時間 (30–120s)
      - entity: input_number.training_custom_cooldown_speed
        name: 收操速度 (2.0–6.0 km/h)
      - entity: input_number.training_custom_cooldown_incline
        name: 收操坡度 (0–15%)
